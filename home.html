<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Unknow</title>
<style>html,body{height:100%;margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}main{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;opacity:0;transition:opacity .3s}main.ok{opacity:1}</style>
</head>
<body>
<main id="m"><h1>Bienvenido</h1><p style="color:#8b98a5">Estás dentro.</p></main>
<script>
(async()=>{
  try{
    const r=await fetch('/api/session');
    if(!r.ok){location.replace('index.html');return}
    document.getElementById('m').classList.add('ok');
  }catch{location.replace('index.html')}
})();
</script>
</body>
</html>
