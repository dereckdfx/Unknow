<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unknow</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:float 14s ease-in-out infinite}
.b1{width:420px;height:420px;background:#1d9bf0;top:-80px;left:-60px}
.b2{width:380px;height:380px;background:#7c3aed;top:30%;right:-100px;animation-delay:-5s}
.b3{width:340px;height:340px;background:#ec4899;bottom:-100px;left:25%;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}}
#app{position:relative;z-index:1;opacity:0;transition:opacity .4s}
#app.ok{opacity:1}
.top{position:sticky;top:0;display:flex;justify-content:center;padding:22px 16px}
.search{position:relative;width:100%;max-width:560px;height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-radius:999px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);
  transition:max-width .45s cubic-bezier(.22,1,.36,1),box-shadow .35s,border-color .35s,background .35s;
  animation:drop .7s cubic-bezier(.22,1,.36,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.94)}to{opacity:1;transform:none}}
.search:focus-within{max-width:640px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);
  box-shadow:0 12px 44px rgba(29,155,240,.35),0 0 0 4px rgba(29,155,240,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.search svg{width:20px;height:20px;flex:none;stroke:#cfd6dd;fill:none;stroke-width:2;stroke-linecap:round;transition:transform .35s,stroke .35s}
.search:focus-within svg{stroke:#fff;transform:scale(1.15) rotate(-8deg)}
.search.typing svg{animation:pulse .5s ease}
@keyframes pulse{50%{transform:scale(1.3) rotate(10deg)}}
#q{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:1.05rem;caret-color:#1d9bf0}
#q::placeholder{color:rgba(255,255,255,.55);transition:opacity .3s}
.search:focus-within #q::placeholder{opacity:.3}
#clear{flex:none;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:15px;line-height:1;cursor:pointer;
  opacity:0;transform:scale(.3) rotate(-90deg);pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
.search.has #clear{opacity:1;transform:none;pointer-events:auto}
#clear:hover{background:rgba(255,255,255,.32)}
.search.clearing #q{animation:wipe .35s ease}
@keyframes wipe{0%{opacity:1;transform:translateX(0)}60%{opacity:0;transform:translateX(18px)}100%{opacity:1;transform:translateX(0)}}
.ripple{position:absolute;inset:0;border-radius:999px;pointer-events:none;box-shadow:0 0 0 0 rgba(255,255,255,.5);opacity:0}
.ripple.go{animation:ripple .55s ease-out}
@keyframes ripple{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,255,255,.45)}100%{opacity:0;box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.hero{padding:12vh 24px;text-align:center}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800}
.hero p{color:rgba(255,255,255,.6);margin-top:10px}

.results{position:absolute;top:calc(100% + 10px);left:0;right:0;padding:8px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 12px 40px rgba(0,0,0,.5);
  opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.22,1,.36,1)}
.results.show{opacity:1;transform:none;pointer-events:auto}
.results a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:#fff;text-decoration:none;transition:background .2s}
.results a:hover{background:rgba(255,255,255,.14)}
.results .ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700}
.results small{display:block;color:rgba(255,255,255,.55);font-size:.8rem}
.results .none{padding:12px 14px;color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <label class="search" id="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Buscar..." autocomplete="off" spellcheck="false">
      <button id="clear" type="button" aria-label="Borrar">✕</button>
      <span class="ripple" id="ripple"></span>
      <div class="results" id="results"></div>
    </label>
  </header>
</div>
<script>
(async()=>{
  try{
    const r=await fetch('/api/session');
    if(!r.ok){location.replace('index.html');return}
    document.getElementById('app').classList.add('ok');
  }catch{location.replace('index.html')}
})();
</script>
<script src="/search.js"></script>
</body>
</html>
