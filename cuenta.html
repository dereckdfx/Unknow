<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css?v=20261011h">
<title>Mi cuenta · Unknow</title>
<style>
.acc{max-width:440px;margin:30px auto 80px;padding:0 18px;display:flex;flex-direction:column;gap:14px}
.acc h1{text-align:center;font-size:1.6rem;margin:0 0 4px}
.acc .card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.acc input,.acc textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:#fff;font:inherit;font-size:16px;outline:none}
.acc input:focus,.acc textarea:focus{border-color:rgba(255,255,255,.4)}
.acc label{font-size:.8rem;opacity:.7}
.acc button,.acc .btn{border:0;border-radius:999px;padding:12px 16px;background:#fff;color:#000;font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}
.acc button.ghost{background:rgba(255,255,255,.1);color:#fff}
.acc button:disabled{opacity:.5}
.msg{font-size:.85rem;min-height:1.2em;text-align:center}.msg.err{color:#ff6b6b}.msg.ok{color:#5be584}
.tabs{display:flex;gap:8px}.tabs button{flex:1}
.pl{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.pl button{background:rgba(255,255,255,.08);color:#fff;text-align:left;border-radius:12px;font-weight:400}
.pl button.on{outline:2px solid #fff}
.hide{display:none}
</style>
</head>
<body>
<div class="acc">
  <h1>Mi cuenta</h1>
  <div id="auth" class="card hide">
    <div class="tabs"><button class="ghost" id="tl" type="button">Iniciar sesión</button><button class="ghost" id="tr" type="button">Registrarme</button></div>
    <input id="em" type="email" placeholder="Correo" autocomplete="email">
    <input id="pw" type="password" placeholder="Contraseña (mínimo 6)" autocomplete="current-password">
    <button id="go" type="button">Entrar</button>
    <div class="msg" id="m1"></div>
  </div>
  <div id="pick" class="card hide">
    <b>¿Cuál es tu perfil?</b>
    <input id="pq" type="text" placeholder="Busca tu nombre">
    <div class="pl" id="pl"></div>
    <button id="claim" type="button" disabled>Este es mi perfil</button>
    <div class="msg" id="m2"></div>
  </div>
  <div id="edit" class="card hide">
    <b id="who"></b>
    <label>a.k.a</label><input id="aka" type="text">
    <label>Sobre mí</label><textarea id="bio" rows="3"></textarea>
    <label>Foto (enlace de imagen)</label><input id="foto" type="url" placeholder="https://...">
    <label>Gustos (separados por coma)</label><textarea id="gus" rows="3"></textarea>
    <button id="save" type="button">Guardar cambios</button>
    <a class="btn ghost" id="ver" href="#" style="background:rgba(255,255,255,.1);color:#fff">Ver mi perfil</a>
    <div class="msg" id="m3"></div>
  </div>
  <button class="ghost" id="out" type="button" style="display:none">Cerrar sesión</button>
  <a class="btn" href="/home.html" style="background:transparent;color:#fff;opacity:.7;text-align:center;text-decoration:none">← Volver</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js?v=20261011h"></script>
<script src="/sb.js?v=20261011h"></script>
<script>
requireSession();
const $=id=>document.getElementById(id);
let mode='login',people=[],chosen=null,user=null;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function setMode(m){mode=m;$('go').textContent=m==='login'?'Entrar':'Crear cuenta';$('pw').autocomplete=m==='login'?'current-password':'new-password';$('tl').style.outline=m==='login'?'2px solid #fff':'none';$('tr').style.outline=m==='register'?'2px solid #fff':'none'}
$('tl').onclick=()=>setMode('login');$('tr').onclick=()=>setMode('register');setMode('login');
const say=(id,t,c)=>{const e=$(id);e.textContent=t||'';e.className='msg '+(c||'')};
const traduce=m=>/Invalid login/i.test(m)?'Correo o contraseña incorrectos.':/already registered/i.test(m)?'Ese correo ya tiene cuenta.':/at least 6/i.test(m)?'La contraseña debe tener mínimo 6 caracteres.':/valid email|invalid/i.test(m)?'Correo no válido.':m;
$('go').onclick=async()=>{
  const email=$('em').value.trim(),password=$('pw').value;say('m1','');
  if(!email||!password)return say('m1','Escribe correo y contraseña.','err');
  $('go').disabled=true;
  const r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/cuenta.html'}});
  $('go').disabled=false;
  if(r.error)return say('m1',traduce(r.error.message),'err');
  if(!r.data.session)return say('m1','Cuenta creada. Si pide confirmar correo, revisa tu bandeja y vuelve a entrar.','ok');
  init();
};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  ['auth','pick','edit'].forEach(i=>$(i).classList.add('hide'));
  if(!session){$('auth').classList.remove('hide');$('out').style.display='none';return}
  user=session.user;$('out').style.display='';
  const {data:mine}=await sb.from('perfiles').select('*').eq('user_id',user.id).maybeSingle();
  if(mine)return showEdit(mine);
  const r=await fetch('/api/escuela',{cache:'no-store'});const D=await r.json();
  const {data:taken}=await sb.from('perfiles').select('slug');
  const t=new Set((taken||[]).map(x=>x.slug));
  people=[].concat(D.sin_clasificar,...Object.values(D.estudiantes_por_grado||{})).filter((x,i,a)=>a.findIndex(y=>y.slug===x.slug)===i&&!t.has(x.slug));
  window.__D=D;
  $('pick').classList.remove('hide');renderPl();
}
function renderPl(){
  const v=norm($('pq').value.trim());
  const l=people.filter(x=>!v||norm(x.nombre+' '+(x.aka||'')+' '+(x.alias||[]).join(' ')).includes(v)).slice(0,30);
  $('pl').innerHTML=l.map(x=>'<button type="button" data-s="'+esc(x.slug)+'" class="'+(chosen&&chosen.slug===x.slug?'on':'')+'">'+esc(dn(x))+'</button>').join('')||'<div class="msg">Sin resultados (o ya fue reclamado).</div>';
}
$('pq').oninput=renderPl;
$('pl').onclick=e=>{const b=e.target.closest('button');if(!b)return;chosen=people.find(x=>x.slug===b.dataset.s);$('claim').disabled=false;renderPl()};
$('claim').onclick=async()=>{
  if(!chosen)return;$('claim').disabled=true;
  const row={user_id:user.id,slug:chosen.slug,aka:chosen.aka||'',bio:'',foto:chosen.foto||'',gustos:chosen.gustos||[]};
  const {data,error}=await sb.from('perfiles').insert(row).select().single();
  if(error){$('claim').disabled=false;return say('m2',/duplicate|unique/i.test(error.message)?'Ese perfil ya fue reclamado por otra cuenta.':error.message,'err')}
  $('pick').classList.add('hide');showEdit(data);
};
function showEdit(p){
  $('edit').classList.remove('hide');
  $('who').textContent='Editando: '+p.slug.replace(/-/g,' ');
  $('aka').value=p.aka||'';$('bio').value=p.bio||'';$('foto').value=p.foto||'';$('gus').value=(p.gustos||[]).join(', ');
  $('ver').href='/estudiante/juanrulfo/'+p.slug+'.html';
  $('save').onclick=async()=>{
    $('save').disabled=true;say('m3','');
    const gustos=$('gus').value.split(',').map(s=>s.trim()).filter(Boolean);
    const {error}=await sb.from('perfiles').update({aka:$('aka').value.trim(),bio:$('bio').value.trim(),foto:$('foto').value.trim(),gustos,updated_at:new Date().toISOString()}).eq('user_id',user.id);
    $('save').disabled=false;
    say('m3',error?error.message:'Guardado ✓',error?'err':'ok');
  };
}
init();
</script>
</body>
</html>
