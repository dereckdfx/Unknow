<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css?v=20261011c">
<title>Juan Rulfo</title>
</head>
<body>
<div id="app">
  <header class="top">
    <label class="search" id="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Buscar..." autocomplete="off" spellcheck="false" aria-label="Buscar">
      <kbd>/</kbd>
      <button id="clear" type="button" aria-label="Borrar">✕</button>
      <span class="ripple" id="ripple"></span>
      <div class="results" id="results" role="listbox"></div>
    </label>
  </header>
  <main class="profile">
    <div class="avatar" id="avatar">J</div>
    <h1>Juan Rulfo</h1>
    <p class="aka">a.k.a Juan Rulfo 0986</p>
    <section class="reveal"><h2>Estudiantes:</h2><div class="chips" id="chips"></div><div class="grid" id="estudiantes"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></section>
    <section class="reveal"><h2>Maestros:</h2><div class="grid" id="maestros"></div></section>
    <section class="reveal"><h2>Orientadores:</h2><div class="grid" id="orientadores"></div></section>
    <section class="reveal"><h2>Directores:</h2><div class="grid" id="directores"></div></section>
  </main>
</div>
<script src="/app.js?v=20261011c"></script>
<script>
requireSession();
function people(el,list,link,role){
  el.innerHTML=list.length?list.map((p,i)=>{
    const inner='<div class="pic">'+av(p)+'</div>'+esc(dn(p))+vbadge(p)+(role?rbadge(role):'');
    return link&&p.slug?'<a class="person" style="--i:'+i+'" href="/estudiante/juanrulfo/'+p.slug+'.html">'+inner+'</a>':'<div class="person" style="--i:'+i+'">'+inner+'</div>';
  }).join(''):'<div class="empty">Aún no hay nadie aquí.</div>';
}
fetch('/api/escuela',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(D=>{
  window.ALL=[].concat(D.sin_clasificar,...Object.values(D.estudiantes_por_grado||{}),D.familiares||[]);
  if(D.foto)document.getElementById('avatar').innerHTML='<img src="'+esc(D.foto)+'" alt="Juan Rulfo">';
  const groups=[{id:'sin',label:'Grado sin clasificar',list:D.sin_clasificar}].concat(D.grados.map(g=>({id:g,label:g,list:D.estudiantes_por_grado[g]||[]})));
  const chips=document.getElementById('chips'),est=document.getElementById('estudiantes');
  function show(id){chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id));people(est,groups.find(g=>g.id===id).list,true)}
  chips.innerHTML=groups.map((g,i)=>'<button class="chip" style="--i:'+i+'" data-id="'+g.id+'">'+esc(g.label)+'<small>'+g.list.length+'</small></button>').join('');
  chips.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)show(c.dataset.id)});
  show('sin');
  people(document.getElementById('maestros'),D.maestros,false,'m');
  people(document.getElementById('orientadores'),D.orientadores,false,'o');
  people(document.getElementById('directores'),D.directores);
}).catch(()=>{document.getElementById('estudiantes').innerHTML='<div class="empty">No se pudo cargar. Recarga la página.</div>'});
</script>
<script src="/search.js?v=20261011c"></script>
</body>
</html>
