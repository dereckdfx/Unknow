<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unknow</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{opacity:0;transition:opacity .4s}#app.ok{opacity:1}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:center;padding:22px 16px}
.search{position:relative;width:100%;max-width:560px;height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:max-width .45s cubic-bezier(.22,1,.36,1),box-shadow .35s,border-color .35s,background .35s;animation:drop .7s cubic-bezier(.22,1,.36,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.94)}to{opacity:1;transform:none}}
.search:focus-within{max-width:640px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);box-shadow:0 12px 44px rgba(29,155,240,.35),0 0 0 4px rgba(29,155,240,.15),inset 0 1px 0 rgba(255,255,255,.3)}
.search svg{width:20px;height:20px;flex:none;stroke:#cfd6dd;fill:none;stroke-width:2;stroke-linecap:round;transition:transform .35s,stroke .35s}
.search:focus-within svg{stroke:#fff;transform:scale(1.15) rotate(-8deg)}
.search.typing svg{animation:pulse .5s ease}@keyframes pulse{50%{transform:scale(1.3) rotate(10deg)}}
#q{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:1.05rem;caret-color:#1d9bf0}
#q::placeholder{color:rgba(255,255,255,.55)}
#clear{flex:none;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:15px;line-height:1;cursor:pointer;opacity:0;transform:scale(.3) rotate(-90deg);pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
.search.has #clear{opacity:1;transform:none;pointer-events:auto}
.search.clearing #q{animation:wipe .35s ease}@keyframes wipe{60%{opacity:0;transform:translateX(18px)}}
.ripple{position:absolute;inset:0;border-radius:999px;pointer-events:none;opacity:0}
.ripple.go{animation:ripple .55s ease-out}@keyframes ripple{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,255,255,.45)}100%{opacity:0;box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.results{position:absolute;top:calc(100% + 10px);left:0;right:0;padding:8px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.22,1,.36,1)}
.results.show{opacity:1;transform:none;pointer-events:auto}
.results a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:#fff;text-decoration:none}
.results a:hover{background:rgba(255,255,255,.14)}
.results .ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:700}
.results small{display:block;color:rgba(255,255,255,.55);font-size:.8rem}
.results .none{padding:12px 14px;color:rgba(255,255,255,.55)}
.profile{max-width:760px;margin:0 auto;padding:30px 20px 80px;text-align:center}
.avatar{width:150px;height:150px;margin:0 auto 18px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:rgba(255,255,255,.4);font-size:3rem;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:2rem;font-weight:800}
.aka{color:rgba(255,255,255,.6);margin-top:6px}
section{margin-top:38px;text-align:left}
section h2{font-size:1.15rem;font-weight:700;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;min-height:60px}
.person{text-align:center;padding:14px 8px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:.9rem}
.person .pic{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;background:rgba(255,255,255,.12);overflow:hidden}
.person .pic img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.chip{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 14px;font-size:.85rem;cursor:pointer;backdrop-filter:blur(12px);transition:background .2s,transform .2s}.chip:hover{background:rgba(255,255,255,.14)}.chip.on{background:#fff;color:#000;font-weight:700}.chip small{opacity:.6;margin-left:4px}.person .pic{display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(255,255,255,.6)}.empty{color:rgba(255,255,255,.4);font-size:.9rem;grid-column:1/-1}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <label class="search" id="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Buscar..." autocomplete="off" spellcheck="false">
      <button id="clear" type="button" aria-label="Borrar">✕</button>
      <span class="ripple" id="ripple"></span>
      <div class="results" id="results"></div>
    </label>
  </header>
  <main class="profile">
    <div class="avatar" id="avatar"></div>
    <h1 id="nm"></h1>
    <p class="aka" id="aka"></p>
                  </main>
</div>
<script>
(async()=>{try{const r=await fetch('/api/session');if(!r.ok){location.replace('/index.html');return}document.getElementById('app').classList.add('ok')}catch{location.replace('/index.html')}})();
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const slug=decodeURIComponent(location.pathname.split('/').pop().replace(/\.html$/,''));
fetch('/api/escuela').then(r=>r.json()).then(D=>{
  const a=D.sin_clasificar.find(x=>x.slug===slug);
  if(!a){document.getElementById('nm').textContent='No encontrado';return}
  document.title=a.nombre;
  document.getElementById('nm').textContent=a.nombre;
  document.getElementById('aka').textContent='a.k.a '+a.aka;
  const av=document.getElementById('avatar');
  av.innerHTML=a.foto?'<img src="'+esc(a.foto)+'" alt="">':esc(a.nombre[0].toUpperCase());
});
</script>
<script src="/search.js"></script>
</body>
</html>
