<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css?v=20261011j">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<title>Unknow</title>
</head>
<body>
<div id="app">
  <header class="top">
    <label class="search" id="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Buscar..." autocomplete="off" spellcheck="false" aria-label="Buscar">
      <kbd>/</kbd>
      <button id="clear" type="button" aria-label="Borrar">✕</button>
      <span class="ripple" id="ripple"></span>
      <div class="results" id="results" role="listbox"></div>
    </label>
  </header>
  <main class="profile">
    <div class="avatar" id="avatar"></div>
    <h1 id="nm"></h1>
    <p class="aka" id="aka"></p>
    <div class="tags" id="tags"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.SB_URL='https://lpiifwwfsfzpjgmjjlpc.supabase.co';window.SB_KEY='sb_publishable_2f2i9te8f2aSs0ujbarctw_dAmoHxtl';</script>
<script src="/app.js?v=20261011j"></script>
<script>
requireSession();
const slug=decodeURIComponent(location.pathname.split('/').pop().replace(/\.html$/,''));
fetch('/api/escuela',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(D=>{
  D.maestros=D.maestros||[];D.orientadores=D.orientadores||[];const STAFF=[].concat(D.maestros.map(x=>Object.assign({_r:'m'},x)),D.orientadores.map(x=>Object.assign({_r:'o'},x)));
  window.ALL=[].concat(D.sin_clasificar,...Object.values(D.estudiantes_por_grado||{}),D.familiares||[],STAFF);
  let a=D.sin_clasificar.find(x=>x.slug===slug),grado='Grado sin clasificar';
  if(!a){for(const g of Object.keys(D.estudiantes_por_grado||{})){const f=(D.estudiantes_por_grado[g]||[]).find(x=>x.slug===slug);if(f){a=f;grado=g;break}}}
  let fam=(D.familiares||[]).find(x=>x.slug===slug);const staff=STAFF.find(x=>x.slug===slug);
  const nm=document.getElementById('nm');
  if(!a&&!fam&&!staff){nm.textContent='No encontrado';document.getElementById('avatar').textContent='?';return}
  const p=a||fam||staff;
  document.title=p.nombre;
  nm.textContent=p.nombre;
  document.getElementById('aka').textContent='a.k.a '+p.aka;
  document.getElementById('avatar').innerHTML=av(p);
  const main=document.querySelector('.profile');
  const chips=[];
  if(a)chips.push('<span class="tag">'+esc(grado==='Grado sin clasificar'?grado:'Grupo '+grado)+'</span>');
  if(fam){
    chips.push('<span class="tag">'+esc(fam.rol)+'</span>');
    const hijo=[].concat(D.sin_clasificar,...Object.values(D.estudiantes_por_grado||{})).find(x=>x.slug===fam.hijo_slug);
    if(hijo)main.insertAdjacentHTML('beforeend','<section class="reveal"><h2>Familia:</h2><div class="grid"><a class="person" href="/estudiante/juanrulfo/'+hijo.slug+'.html"><div class="pic">'+av(hijo)+'</div>'+esc(dn(hijo))+vbadge(hijo)+'<small class="rl">Hijo/a</small></a></div></section>');
  }
  if(a&&a.familia&&a.familia.length)main.insertAdjacentHTML('beforeend','<section class="reveal"><h2>Familia:</h2><div class="grid">'+a.familia.map(f=>f.slug?'<a class="person" href="/estudiante/juanrulfo/'+f.slug+'.html"><div class="pic">'+av(f)+'</div>'+esc(dn(f))+vbadge(f)+'<small class="rl">'+esc(f.rol)+'</small></a>':'<div class="person"><div class="pic">?</div>Sin nombre<small class="rl">'+esc(f.rol)+'</small></div>').join('')+'</div></section>');
  const by=(s,r)=>(r&&STAFF.find(x=>x._r===r&&x.nombre===s))||ALL.find(x=>x.slug===s||x.nombre===s);
  const mk=(list,role)=>list.length?'<div class="grid">'+list.map((n,i)=>{const o=by(n,role);const nm=o?o.nombre:n;const h=o?'/estudiante/juanrulfo/'+o.slug+'.html':null;const inner='<div class="pic">'+av(o||{nombre:nm})+'</div>'+esc(o?dn(o):nm)+vbadge(o||{})+(role?rbadge(role):'');return h?'<a class="person" style="--i:'+i+'" href="'+h+'">'+inner+'</a>':'<div class="person" style="--i:'+i+'">'+inner+'</div>'}).join('')+'</div>':'<div class="empty">Aún no hay nadie aquí.</div>';
  if(staff){chips.push('<span class="tag">'+esc(staff._r==='m'?'Maestro':'Orientador')+'</span>');chips.push('<span class="tag">Escuela Juan Rulfo</span>');nm.insertAdjacentHTML('beforeend',rbadge(staff._r));
    const st=[].concat(D.sin_clasificar,...Object.values(D.estudiantes_por_grado||{})).filter(x=>((staff._r==='m'?x.maestros:x.orientadores)||[]).includes(staff.nombre));
    main.insertAdjacentHTML('beforeend','<section class="reveal"><h2>Escuela:</h2><div class="grid"><a class="person" href="/escuela/juanrulfo.html"><div class="pic">J</div>Juan Rulfo</a></div></section><section class="reveal"><h2>Grupos:</h2><div class="chips"><span class="chip on">3A</span></div></section><section class="reveal"><h2>Alumnos:</h2>'+(st.length?'<div class="grid">'+st.map((o,i)=>'<a class="person" style="--i:'+i+'" href="/estudiante/juanrulfo/'+o.slug+'.html"><div class="pic">'+av(o)+'</div>'+esc(dn(o))+vbadge(o)+'</a>').join('')+'</div>':'<div class="empty">Aún no hay nadie aquí.</div>')+'</section>');}
  if(a){
    const prof=(a.maestros&&a.maestros.length)?a.maestros:[];
    main.insertAdjacentHTML('beforeend','<section class="reveal"><h2>Maestros:</h2>'+mk(prof,'m')+'</section>'+((a.orientadores||[]).length?'<section class="reveal"><h2>Orientador:</h2>'+mk(a.orientadores,'o')+'</section>':'')+'<section class="reveal"><h2>Amigos:</h2>'+mk(a.amigos||[])+'</section><section class="reveal"><h2>Gustos:</h2><div class="chips">'+((a.gustos||[]).length?a.gustos.map((g,i)=>'<span class="chip" style="--i:'+i+'">'+esc(g)+'</span>').join(''):'<span class="empty">Aún no hay gustos.</span>')+'</div></section><section class="reveal"><h2>Comparar:</h2><div class="cmp"><input id="cq" placeholder="Compara con otra persona..." autocomplete="off"><div id="cres" class="cres"></div></div><div id="cout"></div></section>');
    const cq=document.getElementById('cq'),cres=document.getElementById('cres'),cout=document.getElementById('cout');
    const nn=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    cq.addEventListener('input',()=>{const v=nn(cq.value.trim());if(!v){cres.innerHTML='';return}
      cres.innerHTML=ALL.filter(x=>x.slug!==a.slug&&(nn(x.nombre).includes(v)||nn(x.aka||'').includes(v)||nn((x.alias||[]).join(' ')).includes(v))).slice(0,6).map(x=>'<button type="button" data-s="'+x.slug+'">'+esc(x.nombre)+'</button>').join('')});
    cres.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const o=by(b.dataset.s);cres.innerHTML='';cq.value=o.nombre;
      const inter=(x,y)=>x.filter(i=>y.includes(i));
      const fa=(a.amigos||[]).map(s=>(by(s)||{nombre:s}).nombre),fb=(o.amigos||[]).map(s=>(by(s)||{nombre:s}).nombre);
      const ca=inter(fa,fb),cg=inter((a.gustos||[]).map(x=>x.toLowerCase()),(o.gustos||[]).map(x=>x.toLowerCase()));
      const tot=new Set([...(a.gustos||[]).map(x=>x.toLowerCase()),...(o.gustos||[]).map(x=>x.toLowerCase())]).size;
      const pct=tot?Math.round(cg.length/tot*100):0;
      const list=l=>l.length?'<div class="chips">'+l.map(x=>'<span class="chip on">'+esc(x)+'</span>').join('')+'</div>':'<div class="empty">Ninguno en común todavía.</div>';
      cout.innerHTML='<div class="cmpbox"><div class="pct">'+pct+'%<small>de gustos en común</small></div><h3>Amigos en común</h3>'+list(ca)+'<h3>Gustos en común</h3>'+list(cg)+'</div>'});
  }
  document.getElementById('tags').innerHTML=chips.join('');
  if(p.bio)document.getElementById('aka').insertAdjacentHTML('afterend','<p class="bio">'+esc(p.bio)+'</p>');
  if(!p.verificado&&!staff&&!fam&&!p.cuenta){const b=document.createElement('a');b.className='claim';b.textContent='¿Este perfil es tuyo?';b.href='/soporte.html?p='+encodeURIComponent(p.nombre);
    document.getElementById('tags').insertAdjacentElement('afterend',b);}
  if(p.verificado)nm.insertAdjacentHTML('beforeend','<svg class="vf" data-slug="'+esc(p.slug)+'" tabindex="0" viewBox="0 0 24 24" aria-label="Perfil verificado" role="img"><title>Perfil verificado</title><path fill="'+esc(p.verificado)+'" d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.818-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.437 2.25c-.415-.165-.866-.25-1.336-.25-2.11 0-3.818 1.79-3.818 4 0 .494.083.964.237 1.4-1.272.65-2.147 2.018-2.147 3.6 0 1.495.782 2.798 1.942 3.486-.02.17-.032.34-.032.514 0 2.21 1.708 4 3.818 4 .47 0 .92-.086 1.335-.25.62 1.334 1.926 2.25 3.437 2.25 1.512 0 2.818-.916 3.437-2.25.415.163.865.248 1.336.248 2.11 0 3.818-1.79 3.818-4 0-.174-.012-.344-.033-.513 1.158-.687 1.943-1.99 1.943-3.484zm-6.616-3.334l-4.334 6.5c-.145.217-.382.334-.625.334-.143 0-.288-.04-.416-.126l-.115-.094-2.415-2.415c-.293-.293-.293-.768 0-1.06s.768-.294 1.06 0l1.77 1.767 3.825-5.74c.23-.345.696-.436 1.04-.207.346.23.44.696.21 1.04z"/></svg>');
  if(a&&a.logo_unknow)nm.insertAdjacentHTML('beforeend','<img class="ulogo" src="/img/unknow-logo.svg" alt="Unknow" title="Unknow">');
  if(a&&a.tema==='tarjeta'){
    main.classList.add('card');document.body.classList.add('cardpage');
    main.insertAdjacentHTML('afterbegin','<div class="banner"><span>'+esc(a.banner||'')+'</span></div>');
  }
  if(a&&a.miembro_desde)main.insertAdjacentHTML('beforeend','<section class="reveal ms"><h2>Member Since</h2><p class="msd">'+esc(a.miembro_desde)+'</p></section>');
  observeReveal(main);
  (async()=>{try{
    if(!window.supabase||!(a||false))return;
    const c=window.supabase.createClient(SB_URL,SB_KEY);
    const {data:{session}}=await c.auth.getSession();if(!session)return;
    const {data:mine}=await c.from('perfiles').select('*').eq('user_id',session.user.id).maybeSingle();
    if(!mine||mine.slug!==slug)return;
    document.querySelectorAll('.claim,.acclink').forEach(x=>x.remove());
    const btn=document.createElement('button');btn.type='button';btn.className='editbtn';btn.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg> Editar perfil';
    document.getElementById('tags').insertAdjacentElement('afterend',btn);
    btn.onclick=()=>{
      const m=document.createElement('div');m.className='emodal';
      m.innerHTML='<div class="ebox"><div class="ehead"><button type="button" class="ex" aria-label="Cerrar">✕</button><b>Editar perfil</b><button type="button" class="es">Guardar</button></div><div class="ebody"><label>Nombre / a.k.a</label><input id="e_aka"><label>Bio</label><textarea id="e_bio" rows="5"></textarea><label>Foto (enlace de imagen)</label><input id="e_foto" type="url" placeholder="https://..."><label>Gustos (separados por coma)</label><textarea id="e_gus" rows="3"></textarea><div class="emsg" id="e_msg"></div></div></div>';
      document.body.appendChild(m);
      m.querySelector('#e_aka').value=mine.aka||'';m.querySelector('#e_bio').value=mine.bio||'';m.querySelector('#e_foto').value=mine.foto||'';m.querySelector('#e_gus').value=(mine.gustos||[]).join(', ');
      m.querySelector('.ex').onclick=()=>m.remove();
      m.querySelector('.es').onclick=async()=>{
        const b=m.querySelector('.es');b.disabled=true;const msg=m.querySelector('#e_msg');msg.textContent='';
        const row={aka:m.querySelector('#e_aka').value.trim(),bio:m.querySelector('#e_bio').value.trim(),foto:m.querySelector('#e_foto').value.trim(),gustos:m.querySelector('#e_gus').value.split(',').map(x=>x.trim()).filter(Boolean),updated_at:new Date().toISOString()};
        const {error}=await c.from('perfiles').update(row).eq('user_id',session.user.id);
        if(error){b.disabled=false;msg.textContent='No se pudo guardar: '+error.message;return}
        msg.textContent='Guardado ✓';setTimeout(()=>location.reload(),500);
      };
    };
  }catch(err){console.error(err)}})();
}).catch(()=>{document.getElementById('nm').textContent='No se pudo cargar'});
</script>
<script src="/search.js?v=20261011j"></script>
</body>
</html>
