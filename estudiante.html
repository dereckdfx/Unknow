<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
<title>Unknow</title>
</head>
<body>
<div id="app">
  <header class="top">
    <label class="search" id="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Buscar..." autocomplete="off" spellcheck="false" aria-label="Buscar">
      <kbd>/</kbd>
      <button id="clear" type="button" aria-label="Borrar">✕</button>
      <span class="ripple" id="ripple"></span>
      <div class="results" id="results" role="listbox"></div>
    </label>
  </header>
  <main class="profile">
    <div class="avatar" id="avatar"></div>
    <h1 id="nm"></h1>
    <p class="aka" id="aka"></p>
  </main>
</div>
<script src="/app.js"></script>
<script>
requireSession();
const slug=decodeURIComponent(location.pathname.split('/').pop().replace(/\.html$/,''));
fetch('/api/escuela',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(D=>{
  const a=D.sin_clasificar.find(x=>x.slug===slug);
  if(!a){document.getElementById('nm').textContent='No encontrado';document.getElementById('avatar').textContent='?';return}
  document.title=a.nombre;
  document.getElementById('nm').textContent=a.nombre;
  document.getElementById('aka').textContent='a.k.a '+a.aka;
  document.getElementById('avatar').innerHTML=a.foto?'<img src="'+esc(a.foto)+'" alt="">':esc(a.nombre[0].toUpperCase());
}).catch(()=>{document.getElementById('nm').textContent='No se pudo cargar'});
</script>
<script src="/search.js"></script>
</body>
</html>
